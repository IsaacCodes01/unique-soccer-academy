<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team | Royal Unique FC</title>
    <meta name="description" content="Meet the coaches and players of Royal Unique FC, a football club in Kasoa-Apra, Ghana.">
    <meta name="theme-color" content="#0B0B0D">
    <link rel="canonical" href="https://isaaccodes01.github.io/unique-soccer-academy/team.html">
    <link rel="manifest" href="site.webmanifest">

    <!-- Link previews on WhatsApp, Facebook (Open Graph) and X/Twitter.
         These need full addresses (https://...), not "assets/...". -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Royal Unique FC">
    <meta property="og:title" content="Team | Royal Unique FC">
    <meta property="og:description" content="Meet the coaches and players of Royal Unique FC, a football club in Kasoa-Apra, Ghana.">
    <meta property="og:url" content="https://isaaccodes01.github.io/unique-soccer-academy/team.html">
    <meta property="og:image" content="https://isaaccodes01.github.io/unique-soccer-academy/assets/images/share-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The Royal Unique FC crest on the training pitch, with the motto Where Champions Are Made">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Team | Royal Unique FC">
    <meta name="twitter:description" content="Meet the coaches and players of Royal Unique FC, a football club in Kasoa-Apra, Ghana.">
    <meta name="twitter:image" content="https://isaaccodes01.github.io/unique-soccer-academy/assets/images/share-image.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts and icons load in the background so they don't hold up the
         first paint: media="print" means "not needed for the screen yet",
         and onload switches them on as soon as they arrive. The <noscript>
         copies are for visitors without JavaScript. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@600;700&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="css/style.css">
    <!-- Runs before the page is drawn: no "defer" on purpose (see the file) -->
    <script src="js/boot.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></noscript>
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
</head>
<body>
    <!--Start of Main Container-->
    <div class="maincontainer">

        <!-- Header + navigation: built by js/layout.js -->
        <div id="site-header"></div>

            <main>
                <!--Start of Page banner-->
                <section class="page-banner">
                    <picture><source srcset="assets/images/Unique_6.webp" type="image/webp"><img class="page-banner__bg" src="assets/images/Unique_6.jpg" alt="" fetchpriority="high" width="960" height="1280" style="--banner-focus: 30%"></picture>
                    <div class="container">
                        <h1 class="page-banner__title">Our Team</h1>
                        <nav aria-label="Breadcrumb">
                            <ol class="breadcrumb">
                                <li><a href="index.html">Home</a></li>
                                <li aria-current="page">Team</li>
                            </ol>
                        </nav>
                    </div>
                </section>
                <!--End of Page banner-->

                <!--Start of Coaches and players (filled in by js/team.js
                    from STAFF and PLAYERS in js/data.js)-->
                <section class="section section--light team-page">
                    <div class="container">
                        <p class="eyebrow">Coaches &amp; players</p>
                        <h2 class="section-title" data-reveal="up">Meet the team</h2>

                        <!-- Filter chips: toggle buttons, aria-pressed says which one is on -->
                        <div class="chips" role="group" aria-label="Show">
                            <button class="chip" type="button" data-filter="all" aria-pressed="true">
                                All <span class="chip__count" data-count-for="all"></span>
                            </button>
                            <button class="chip" type="button" data-filter="coaches" aria-pressed="false">
                                <i class="fa-solid fa-clipboard" aria-hidden="true"></i> Coaches
                                <span class="chip__count"></span>
                            </button>
                            <button class="chip" type="button" data-filter="goalkeeper" aria-pressed="false">
                                <i class="fa-solid fa-hand" aria-hidden="true"></i> Goalkeepers
                                <span class="chip__count"></span>
                            </button>
                            <button class="chip" type="button" data-filter="defender" aria-pressed="false">
                                <i class="fa-solid fa-shield-halved" aria-hidden="true"></i> Defenders
                                <span class="chip__count"></span>
                            </button>
                            <button class="chip" type="button" data-filter="midfielder" aria-pressed="false">
                                <i class="fa-solid fa-arrows-left-right" aria-hidden="true"></i> Midfielders
                                <span class="chip__count"></span>
                            </button>
                            <button class="chip" type="button" data-filter="forward" aria-pressed="false">
                                <i class="fa-solid fa-futbol" aria-hidden="true"></i> Forwards
                                <span class="chip__count"></span>
                            </button>
                        </div>
                        <!-- Read out by screen readers after each filter click -->
                        <p class="visually-hidden" id="filter-status" aria-live="polite"></p>

                        <!--Start of Coaches & staff-->
                        <div class="team-block" id="staff-block">
                            <h3 class="team-block__heading">Coaches &amp; Staff</h3>
                            <div class="profile-grid" id="staff-list"></div>
                        </div>
                        <!--End of Coaches & staff-->

                        <!--Start of Squad-->
                        <div class="team-block" id="squad-block">
                            <h3 class="team-block__heading">Squad</h3>
                            <div class="profile-grid" id="squad-list">
                                <div class="news-empty">
                                    <span class="news-empty__icon" aria-hidden="true"><i class="fa-solid fa-shirt"></i></span>
                                    <h4 class="news-empty__title">Squad coming soon</h4>
                                    <p>Player profiles will appear here.</p>
                                </div>
                            </div>
                        </div>
                        <!--End of Squad-->

                        <noscript>
                            <p class="gallery__noscript">Please turn on JavaScript to see our coaches and players.</p>
                        </noscript>
                    </div>
                </section>
                <!--End of Coaches and players-->
            </main>

        <!-- Footer: built by js/layout.js -->
        <div id="site-footer"></div>

    </div>
    <!--End of Main Container-->

    <script src="js/data.js" defer></script>
    <script src="js/layout.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/team.js" defer></script>
</body>
</html>
